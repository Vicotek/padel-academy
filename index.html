  <section id="sobre-mi" class="section about">

      <div class="pillars">

          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#1F5FA8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg>

  <!-- RESERVAR -->
  <section id="reservar" class="section booking">
    <div class="container stack">
      <div class="head">
        <span class="kicker" data-i18n="bookKicker"></span>
        <h2 class="h2" data-i18n="bookTitle"></h2>
        <p class="lead-text" data-i18n="bookText"></p>
      </div>

      <div class="booking-grid">
        <div class="booking-main">
          <div class="step">
            <h3><span class="step-num">1</span><span data-i18n="step1"></span></h3>
            <div class="types" id="types"></div>
          </div>
          <div class="step">
            <div class="step-head">
              <h3><span class="step-num">2</span><span data-i18n="step2"></span></h3>
              <span class="month" id="month"></span>
            </div>
            <div class="days" id="days"></div>
          </div>
          <div class="step">
            <div class="step-head">
              <h3><span class="step-num">3</span><span data-i18n="step3"></span></h3>
              <div class="legend">
                <span><span class="sw sw--free"></span><span data-i18n="legFree"></span></span>
                <span><span class="sw sw--busy"></span><span data-i18n="legBusy"></span></span>
                <span><span class="sw sw--sel"></span><span data-i18n="legSel"></span></span>
              </div>
            </div>
            <div class="slots" id="slots"></div>
          </div>
        </div>

        <aside class="summary" aria-live="polite">
          <div class="stack" style="gap:20px" id="sum-form">
            <h3 data-i18n="sumTitle"></h3>
            <div class="sum-rows">
              <div class="sum-row"><span data-i18n="sumClass"></span><strong id="sum-type"></strong></div>
              <div class="sum-row"><span data-i18n="sumDay"></span><strong id="sum-day"></strong></div>
              <div class="sum-row"><span data-i18n="sumTime"></span><strong id="sum-slot"></strong></div>
              <div class="sum-row"><span data-i18n="sumPrice"></span><strong class="price" id="sum-price"></strong></div>
            </div>
            <div class="field">
              <label for="pa-name" data-i18n="nameLabel"></label>
              <input id="pa-name" type="text" autocomplete="name" data-i18n-placeholder="namePh">
            </div>
            <div class="field">
              <label for="pa-phone" data-i18n="phoneLabel"></label>
              <input id="pa-phone" type="tel" autocomplete="tel" placeholder="+45 …">
            </div>
            <button type="button" class="confirm-btn" id="confirm" data-i18n="confirm" disabled></button>
            <p class="hint" id="hint"></p>
          </div>
          <div class="stack" style="gap:18px" id="sum-done" hidden>
            <div class="done-check"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0E2233" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></div>
            <h3 data-i18n="doneTitle"></h3>
            <p class="done-text" id="done-text"></p>
            <a class="btn btn--lime" id="wa-booking" href="https://wa.me/4571380894" target="_blank" rel="noopener">
              <svg class="wa-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.5 7.4L3 21l2.1-5.3A8.4 8.4 0 1 1 21 11.5z"/></svg>
              <span data-i18n="waBtn"></span>
            </a>
            <button type="button" class="again-btn" id="again" data-i18n="again"></button>
          </div>
          <div class="synced">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#D7F25A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
            <span data-i18n="synced"></span>
          </div>
        </aside>
      </div>
    </div>
  </section>
